name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Minimum global coverage (%) a PR must meet for the coverage check to pass.
  COVERAGE_TARGET: 95

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    name: Coverage check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests with coverage threshold
        run: |
          T=$COVERAGE_TARGET
          npx jest --coverage --coverageThreshold="{\"global\":{\"lines\":$T,\"statements\":$T,\"branches\":$T,\"functions\":$T}}"
