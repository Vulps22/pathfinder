name: Release

# Publishes to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # A release tagged v1.1.0 must match "version": "1.1.0" in package.json.
      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # Pre-releases go to the "next" dist-tag so they are not installed by default.
      - name: Publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --tag "$DIST_TAG"
